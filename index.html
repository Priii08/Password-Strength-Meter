<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Checker</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="container">
        <h2>PASSWORD STRENGTH METER</h2>
        <input type="password" id="password" placeholder="Enter your password">
        <div id="password-strength-meter">
            <div id="strength-bar"></div>
        </div>
        <div id="password-strength-status"></div>
        <div id="password-requirements">
            <ul>
                <li id="length-requirement" class="incomplete">At least 8 characters</li>
                <li id="uppercase-requirement" class="incomplete">At least one uppercase letter</li>
                <li id="lowercase-requirement" class="incomplete">At least one lowercase letter</li>
                <li id="number-requirement" class="incomplete">At least one number</li>
                <li id="special-requirement" class="incomplete">At least one special character</li>
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
